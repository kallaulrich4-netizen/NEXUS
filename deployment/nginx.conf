# Reverse proxy Nginx pour Nexus.
# Remplacez "votre-domaine.tld" par votre vrai nom de domaine avant déploiement.

server {
    listen 80;
    server_name votre-domaine.tld;

    # Requis pour le renouvellement Let's Encrypt (certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name votre-domaine.tld;

    ssl_certificate     /etc/letsencrypt/live/votre-domaine.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.tld/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;  # uploads (photos/vidéos Studio, pièces jointes)

    # Frontend : fichiers statiques compilés (voir deployment/deploy.sh).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # SPA React : toutes les routes retombent sur index.html
    }

    # Backend : tout /api/* est renvoyé vers FastAPI/Uvicorn.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Note : /docs, /redoc et /openapi.json sont désactivés par défaut en
    # production (ENVIRONMENT=production, voir app/main.py). Pour les
    # réactiver ponctuellement, changez ENVIRONMENT ou ajoutez ici un accès
    # restreint (ex: allow <votre IP>; deny all;).
}
