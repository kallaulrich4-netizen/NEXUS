[alembic]
script_location = migrations

# L'URL réelle vient de app.core.config (variable DATABASE_URL), voir
# migrations/env.py — cette ligne n'est qu'un repli si jamais rien d'autre
# n'est configuré.
sqlalchemy.url = sqlite:///./nexus.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
